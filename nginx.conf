server {
    # IPv4 и IPv6: приватная сеть Railway (front.railway.internal) — IPv6.
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем: после деплоя браузер сразу берёт новые хэши бандлов.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
